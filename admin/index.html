<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GrowDashboard Admin</title>
    <link rel="stylesheet" href="../../lib/css/adapter.css" />
    <script src="../../lib/js/adapter-settings.js"></script>
</head>
<body>
<div class="m adapter-container">
    <div class="row">
        <div class="col s12">
            <h5 data-i18n="GrowDashboard Settings"></h5>
        </div>
    </div>
    <div class="row">
        <div class="col s12 m6">
            <div class="input-field">
                <input type="text" id="grafanaUrl" />
                <label for="grafanaUrl" data-i18n="Grafana URL"></label>
            </div>
        </div>
        <div class="col s12 m6">
            <div class="input-field">
                <input type="password" id="grafanaToken" />
                <label for="grafanaToken" data-i18n="Grafana API Token"></label>
            </div>
        </div>
    </div>
</div>

<script>
    function load(settings, onChange) {
        if (!settings) return;
        $('#grafanaUrl').val(settings.grafanaUrl || '').on('change', onChange);
        $('#grafanaToken').val(settings.grafanaToken || '').on('change', onChange);
        onChange(false);
    }

    function save(callback) {
        callback({
            grafanaUrl:   $('#grafanaUrl').val(),
            grafanaToken: $('#grafanaToken').val(),
        });
    }
</script>
</body>
</html>
