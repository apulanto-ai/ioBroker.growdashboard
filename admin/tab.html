<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>GrowDashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px;
        }
        .card {
            background: #161b22;
            border: 1px solid #21262d;
            border-radius: 16px;
            padding: 40px 48px;
            text-align: center;
            max-width: 480px;
            width: 100%;
        }
        .icon { margin-bottom: 20px; }
        h2 { font-size: 1.4rem; color: #4ade80; margin-bottom: 8px; }
        p  { color: #6b7280; font-size: 0.9rem; line-height: 1.6; margin-bottom: 28px; }
        .btn {
            display: inline-block;
            background: #166534;
            color: #4ade80;
            border: 1px solid #22c55e;
            border-radius: 10px;
            padding: 12px 32px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: #14532d; }
        .hint { margin-top: 16px; font-size: 0.75rem; color: #374151; }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a10 10 0 0 1 10 10c0 5-4 9-9 10C7 21 2 16 2 12A10 10 0 0 1 12 2z"/>
            <path d="M12 12c0-4 2-7 5-9"/>
            <path d="M12 12c0-4-2-7-5-9"/>
            <path d="M12 12v9"/>
        </svg>
    </div>
    <h2>GrowDashboard</h2>
    <p>Das vollstaendige Dashboard laeuft als eigenstaendige Webseite ueber den ioBroker Web-Adapter.</p>
    <a class="btn" id="dashLink" href="#" target="_blank">Dashboard oeffnen</a>
    <div class="hint" id="hintText">Ermittle URL...</div>
</div>

<script>
(function () {
    // Derive web adapter URL from current admin origin
    const match = window.location.pathname.match(/\/(growdashboard\.\d+)\//);
    const instance = (match && match[1]) || 'growdashboard.0';

    // Admin is typically on :8081, web adapter on :8082
    const webPort = 8082;
    const url = `${window.location.protocol}//${window.location.hostname}:${webPort}/${instance}/`;

    document.getElementById('dashLink').href = url;
    document.getElementById('hintText').textContent = url;
})();
</script>
</body>
</html>
